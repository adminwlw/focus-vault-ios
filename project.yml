name: FocusVault
options:
  bundleIdPrefix: com.sim360
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  FocusVault:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - Info.plist
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sim360.focusvault
        PRODUCT_NAME: FocusVault
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      testTargets:
        - FocusVaultTests
        - FocusVaultUITests
      gatherCoverageData: true
  FocusVaultTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: FocusVault
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sim360.focusvault.tests
        GENERATE_INFOPLIST_FILE: YES
  FocusVaultUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: FocusVault
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sim360.focusvault.uitests
        TEST_TARGET_NAME: FocusVault
        GENERATE_INFOPLIST_FILE: YES

