name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project FocusVault.xcodeproj \
            -scheme FocusVault \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest' \
            -only-testing:FocusVaultTests \
            -resultBundlePath build/TestResults.xcresult 2>&1 | tee build/tests.log

      - name: Upload unit test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FocusVault-unit-log-${{ github.run_id }}
          path: build/tests.log
          retention-days: 7

      - name: Build device app without signing
        id: device_build
        if: steps.tests.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild build \
            -project FocusVault.xcodeproj \
            -scheme FocusVault \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO 2>&1 | tee build/device-build.log

      - name: UI test on iPhone SE
        id: ui_tests_small
        if: steps.tests.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          xcrun simctl boot 'iPhone SE (3rd generation)' || true
          xcrun simctl bootstatus 'iPhone SE (3rd generation)' -b
          xcrun simctl addmedia 'iPhone SE (3rd generation)' Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          result=0
          for appearance in light dark; do
          xcrun simctl ui 'iPhone SE (3rd generation)' appearance "$appearance"
          xcodebuild test \
            -project FocusVault.xcodeproj \
            -scheme FocusVault \
            -destination 'platform=iOS Simulator,name=iPhone SE (3rd generation),OS=latest' \
            -parallel-testing-enabled NO \
            -only-testing:FocusVaultUITests \
            -resultBundlePath "build/UITest-se-$appearance.xcresult" 2>&1 | tee "build/ui-tests-se-$appearance.log" || result=1
          done
          exit "$result"

      - name: Upload small-screen test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FocusVault-SE-log-${{ github.run_id }}
          path: build/ui-tests-se-*.log
          retention-days: 7

      - name: UI test on iPhone 16 Pro Max
        id: ui_tests_large
        if: steps.tests.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          xcrun simctl boot 'iPhone 16 Pro Max' || true
          xcrun simctl bootstatus 'iPhone 16 Pro Max' -b
          xcrun simctl addmedia 'iPhone 16 Pro Max' Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          result=0
          for appearance in light dark; do
          xcrun simctl ui 'iPhone 16 Pro Max' appearance "$appearance"
          xcodebuild test \
            -project FocusVault.xcodeproj \
            -scheme FocusVault \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro Max,OS=latest' \
            -parallel-testing-enabled NO \
            -only-testing:FocusVaultUITests \
            -resultBundlePath "build/UITest-promax-$appearance.xcresult" 2>&1 | tee "build/ui-tests-promax-$appearance.log" || result=1
          done
          exit "$result"

      - name: Export UI test screenshots
        if: always()
        run: |
          for configuration in se-light se-dark promax-light promax-dark; do
            mkdir -p "build/ui-screens/$configuration"
            test ! -d "build/UITest-$configuration.xcresult" || xcrun xcresulttool export attachments --path "build/UITest-$configuration.xcresult" --output-path "build/ui-screens/$configuration" || true
          done

      - name: Package IPA
        if: steps.device_build.outcome == 'success'
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/FocusVault.app"
          test -d "$APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")" = "0.3.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")" = "4"
          /usr/libexec/PlistBuddy -c 'Print :UILaunchScreen' "$APP_PATH/Info.plist" >/dev/null
          /usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' "$APP_PATH/Info.plist" >/dev/null
          /usr/libexec/PlistBuddy -c 'Print :NSPhotoLibraryUsageDescription' "$APP_PATH/Info.plist" >/dev/null
          /usr/libexec/PlistBuddy -c 'Print :NSPhotoLibraryAddUsageDescription' "$APP_PATH/Info.plist" >/dev/null
          /usr/libexec/PlistBuddy -c 'Print :NSFaceIDUsageDescription' "$APP_PATH/Info.plist" >/dev/null
          test -s "$APP_PATH/Assets.car"
          test -s "$APP_PATH/PrivacyInfo.xcprivacy"
          plutil -lint "$APP_PATH/PrivacyInfo.xcprivacy"
          compgen -G "$APP_PATH/AppIcon*.png" >/dev/null
          ditto -c -k --sequesterRsrc --keepParent build/Payload build/FocusVault-0.3.0-unsigned.ipa
          shasum -a 256 build/FocusVault-0.3.0-unsigned.ipa > build/FocusVault-0.3.0-unsigned.ipa.sha256

      - name: Upload IPA and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FocusVault-iOS-0.3.0-build-4
          path: |
            build/FocusVault-0.3.0-unsigned.ipa
            build/FocusVault-0.3.0-unsigned.ipa.sha256
            build/ui-screens
            build/*.log
          if-no-files-found: error
          retention-days: 30

      - name: Fail workflow when verification failed
        if: steps.tests.outcome != 'success' || steps.device_build.outcome != 'success' || steps.ui_tests_small.outcome != 'success' || steps.ui_tests_large.outcome != 'success'
        run: exit 1

