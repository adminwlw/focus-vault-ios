name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [focus-vault-ios]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project FocusVault.xcodeproj \
            -scheme FocusVault \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest' \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/tests.log

      - name: Build device app without signing
        id: device_build
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild build \
            -project FocusVault.xcodeproj \
            -scheme FocusVault \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO 2>&1 | tee build/device-build.log

      - name: Package IPA
        if: steps.device_build.outcome == 'success'
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/FocusVault.app"
          test -d "$APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist"
          ditto -c -k --sequesterRsrc --keepParent build/Payload build/FocusVault-0.1.0-unsigned.ipa
          shasum -a 256 build/FocusVault-0.1.0-unsigned.ipa > build/FocusVault-0.1.0-unsigned.ipa.sha256

      - name: Upload IPA and test results
        if: steps.tests.outcome == 'success' && steps.device_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: FocusVault-iOS-0.1.0-build-1
          path: |
            build/FocusVault-0.1.0-unsigned.ipa
            build/FocusVault-0.1.0-unsigned.ipa.sha256
            build/TestResults.xcresult
          if-no-files-found: error
          retention-days: 30

      - name: Publish IPA or diagnostics to build branch
        if: always()
        run: |
          mkdir -p release
          rm -rf release/ci
          mkdir -p release/ci
          test ! -f build/tests.log || cp build/tests.log release/ci/
          test ! -f build/device-build.log || cp build/device-build.log release/ci/
          test ! -f build/FocusVault-0.1.0-unsigned.ipa || cp build/FocusVault-0.1.0-unsigned.ipa release/
          test ! -f build/FocusVault-0.1.0-unsigned.ipa.sha256 || cp build/FocusVault-0.1.0-unsigned.ipa.sha256 release/
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f release
          git diff --cached --quiet && exit 0
          git commit -m "build: publish unsigned IPA [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Fail workflow when verification failed
        if: steps.tests.outcome != 'success' || steps.device_build.outcome != 'success'
        run: exit 1

