name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project FocusVault.xcodeproj \
            -scheme FocusVault \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest' \
            -only-testing:FocusVaultTests \
            -resultBundlePath build/TestResults.xcresult 2>&1 | tee build/tests.log

      - name: Build device app without signing
        id: device_build
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild build \
            -project FocusVault.xcodeproj \
            -scheme FocusVault \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO 2>&1 | tee build/device-build.log

      - name: UI test on iPhone SE
        id: ui_tests_small
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test \
            -project FocusVault.xcodeproj \
            -scheme FocusVault \
            -destination 'platform=iOS Simulator,name=iPhone SE (3rd generation),OS=latest' \
            -only-testing:FocusVaultUITests \
            -resultBundlePath build/UITest-SE.xcresult 2>&1 | tee build/ui-tests-se.log

      - name: UI test on iPhone 16 Pro Max
        id: ui_tests_large
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test \
            -project FocusVault.xcodeproj \
            -scheme FocusVault \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro Max,OS=latest' \
            -only-testing:FocusVaultUITests \
            -resultBundlePath build/UITest-ProMax.xcresult 2>&1 | tee build/ui-tests-promax.log

      - name: Export UI test screenshots
        if: always()
        run: |
          mkdir -p build/ui-screens/se build/ui-screens/promax
          test ! -d build/UITest-SE.xcresult || xcrun xcresulttool export attachments --path build/UITest-SE.xcresult --output-path build/ui-screens/se || true
          test ! -d build/UITest-ProMax.xcresult || xcrun xcresulttool export attachments --path build/UITest-ProMax.xcresult --output-path build/ui-screens/promax || true

      - name: Package IPA
        if: steps.device_build.outcome == 'success'
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/FocusVault.app"
          test -d "$APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")" = "0.1.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")" = "1"
          /usr/libexec/PlistBuddy -c 'Print :UILaunchScreen' "$APP_PATH/Info.plist" >/dev/null
          /usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' "$APP_PATH/Info.plist" >/dev/null
          /usr/libexec/PlistBuddy -c 'Print :NSPhotoLibraryUsageDescription' "$APP_PATH/Info.plist" >/dev/null
          test -s "$APP_PATH/Assets.car"
          test -s "$APP_PATH/PrivacyInfo.xcprivacy"
          plutil -lint "$APP_PATH/PrivacyInfo.xcprivacy"
          compgen -G "$APP_PATH/AppIcon*.png" >/dev/null
          ditto -c -k --sequesterRsrc --keepParent build/Payload build/FocusVault-0.1.0-unsigned.ipa
          shasum -a 256 build/FocusVault-0.1.0-unsigned.ipa > build/FocusVault-0.1.0-unsigned.ipa.sha256

      - name: Upload IPA and test results
        if: steps.tests.outcome == 'success' && steps.device_build.outcome == 'success' && steps.ui_tests_small.outcome == 'success' && steps.ui_tests_large.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: FocusVault-iOS-0.1.0-build-1
          path: |
            build/FocusVault-0.1.0-unsigned.ipa
            build/FocusVault-0.1.0-unsigned.ipa.sha256
            build/TestResults.xcresult
            build/UITest-SE.xcresult
            build/UITest-ProMax.xcresult
            build/ui-screens
            build/*.log
          if-no-files-found: error
          retention-days: 30

      - name: Fail workflow when verification failed
        if: steps.tests.outcome != 'success' || steps.device_build.outcome != 'success' || steps.ui_tests_small.outcome != 'success' || steps.ui_tests_large.outcome != 'success'
        run: exit 1

